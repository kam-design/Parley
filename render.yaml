services:
  - type: web
    name: parley
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
